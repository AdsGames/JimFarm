name: Deploy Game

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: "./build/release/_deps"
          key: deps-${{ runner.os }}

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.6
          actions-cache-folder: "emsdk-cache"

      - name: Download ports
        run: |
          embuilder build harfbuzz

      - name: Configure
        run: emcmake cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/release/target/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to A.D.S. Games
        if: startsWith(github.ref, 'refs/tags/v')
        uses: adsgames/deploy-to-adsgames@v1
        with:
          project-id: jim-farm
          build-dir: ./build/release/target/
          platform: WEB
          api-key: ${{ secrets.ADSGAMES_API_KEY }}
